<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>カメラデザイン比較｜Catchwords</title>
    <style>
      * { box-sizing: border-box; }
      :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color: #172033; }
      body { margin: 0; background: #eef2f6; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .page { min-height: 100dvh; display: grid; grid-template-columns: minmax(280px, 380px) minmax(320px, 430px); justify-content: center; gap: 44px; padding: 32px; }
      .notes { align-self: center; }
      .eyebrow { margin: 0 0 8px; color: #0877ee; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; }
      .lead { color: #5a6578; line-height: 1.8; }
      .steps { padding: 0; list-style: none; display: grid; gap: 10px; }
      .steps li { display: flex; gap: 10px; line-height: 1.55; }
      .steps b { flex: 0 0 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; color: white; background: #0877ee; font-size: 12px; }
      .vote { margin-top: 24px; padding: 16px; border-radius: 18px; background: white; box-shadow: 0 10px 35px #23344d12; }
      .vote strong { display: block; margin-bottom: 6px; }
      .phone { position: relative; align-self: center; width: 100%; aspect-ratio: 9/19.5; max-height: calc(100dvh - 32px); overflow: hidden; border: 8px solid #15191f; border-radius: 44px; color: white; background: #202a30; box-shadow: 0 28px 70px #1a273c30; isolation: isolate; }
      video, .fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
      .fallback { background: radial-gradient(circle at 34% 35%, #ceb489 0 11%, transparent 12%), radial-gradient(circle at 62% 48%, #71895e 0 18%, transparent 19%), linear-gradient(145deg, #75899b, #d7c3a2 45%, #404c3c); }
      .shade { position: absolute; inset: 0; background: linear-gradient(#0008, transparent 18%, transparent 62%, #000 98%); pointer-events: none; }
      .top { position: absolute; z-index: 5; inset: max(12px, env(safe-area-inset-top)) 14px auto; display: flex; align-items: center; justify-content: space-between; }
      .glass { border: 1px solid #ffffff2c; color: white; background: #0b11186e; backdrop-filter: blur(16px); }
      .close { width: 44px; height: 44px; border: 0; border-radius: 50%; font-size: 23px; }
      .title { border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700; }
      .switcher { position: absolute; z-index: 6; top: 76px; inset-inline: 12px; display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 4px; border-radius: 16px; }
      .switcher button { min-height: 38px; border: 0; border-radius: 12px; color: #ffffffa8; background: transparent; font-size: 12px; }
      .switcher button[aria-pressed="true"] { color: #172033; background: white; font-weight: 800; }
      .hint { position: absolute; z-index: 4; top: 25%; left: 50%; translate: -50%; width: max-content; margin: 0; padding: 8px 13px; border-radius: 999px; background: #0004; font-size: 12px; backdrop-filter: blur(10px); }
      .guide { position: absolute; z-index: 3; left: 50%; top: 46%; translate: -50% -50%; width: 68%; aspect-ratio: 1; transition: .35s ease; }
      .guide span { display: none; position: absolute; width: 52px; height: 52px; border-color: #fffd; }
      [data-design="halo"] .guide { border: 1px solid #fffb; border-radius: 43% 57% 52% 48% / 52% 44% 56% 48%; box-shadow: 0 0 0 999px #0002; animation: breathe 4.5s ease-in-out infinite alternate; }
      [data-design="corners"] .guide { aspect-ratio: 4/3; }
      [data-design="corners"] .guide span { display: block; }
      [data-design="corners"] .guide span:nth-child(1) { left:0; top:0; border-left:2px solid; border-top:2px solid; border-radius:14px 0 0; }
      [data-design="corners"] .guide span:nth-child(2) { right:0; top:0; border-right:2px solid; border-top:2px solid; border-radius:0 14px 0 0; }
      [data-design="corners"] .guide span:nth-child(3) { left:0; bottom:0; border-left:2px solid; border-bottom:2px solid; border-radius:0 0 0 14px; }
      [data-design="corners"] .guide span:nth-child(4) { right:0; bottom:0; border-right:2px solid; border-bottom:2px solid; border-radius:0 0 14px; }
      [data-design="portal"] .guide { width: 62%; border: 2px solid #fffd; border-radius: 50%; box-shadow: 0 0 0 999px #0003, 0 0 30px #fff3; }
      @keyframes breathe { to { border-radius: 55% 45% 46% 54% / 46% 55% 45% 54%; scale: 1.025; } }
      .controls { position: absolute; z-index: 7; inset: auto 0 0; padding: 70px 14px max(16px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #0007 30%, #000e); }
      .zoom { display:flex; justify-content:center; gap:4px; margin-bottom: 18px; }
      .zoom button { width: 43px; height:32px; border:0; border-radius:999px; color:#ffffffaa; background:transparent; font-size:12px; font-weight:800; }
      .zoom button[aria-pressed="true"] { color:white; background:#ffffff2b; }
      .search { display:none; gap:7px; margin-bottom:14px; padding:7px; border-radius:16px; }
      .search.open { display:flex; }
      .search input { min-width:0; flex:1; height:42px; border:0; border-radius:11px; padding:0 12px; }
      .search button { width:42px; border:0; border-radius:11px; color:white; background:#0877ee; }
      .actions { display:grid; grid-template-columns:1fr 88px 1fr; align-items:center; gap:4px; }
      .action { min-height:66px; border:0; color:white; background:transparent; font-size:11px; }
      .action i { display:block; margin-bottom:5px; font-size:21px; font-style:normal; }
      .shutter { width:88px; height:88px; border:3px solid #fff9; border-radius:50%; background:#ffffff25; padding:8px; transition:.1s; }
      .shutter::after { content:""; display:block; width:100%; height:100%; border-radius:50%; background:white; }
      .shutter:active { scale:.9; }
      .flash { position:absolute; z-index:20; inset:0; pointer-events:none; background:white; opacity:0; }
      .flash.go { animation: flash .35s ease; }
      @keyframes flash { 40% { opacity:.9; } }
      .toast { position:absolute; z-index:20; left:50%; bottom:185px; translate:-50% 12px; opacity:0; width:max-content; padding:10px 15px; border-radius:999px; color:white; background:#111d; font-size:12px; transition:.25s; }
      .toast.show { translate:-50% 0; opacity:1; }
      @media (max-width: 760px) { .page { display:block; padding:0; } .notes { display:none; } .phone { max-height:none; width:100%; height:100dvh; border:0; border-radius:0; } }
      @media (prefers-reduced-motion: reduce) { *, *::after { animation:none!important; transition:none!important; } }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="notes">
        <p class="eyebrow">MERGE前のデザイン比較</p>
        <h1>3案を、実際に触って比べる</h1>
        <p class="lead">これは比較専用ページです。GitHubへマージしなくても、プレビューURLから3案の見た目と基本操作を確認できます。</p>
        <ol class="steps">
          <li><b>1</b><span>右の画面上部で「やわらかい輪」「四隅」「楕円」を順番に押します。</span></li>
          <li><b>2</b><span>1×・2×、文字検索、シャッター、スキャンを触ります。</span></li>
          <li><b>3</b><span>一番好きな案の名前をメモします。迷ったら「四隅」が最も標準的です。</span></li>
        </ol>
        <div class="vote"><strong>おすすめの伝え方</strong>「四隅が好き。案内文はもう少し下」のように、案名＋直したい所を教えてください。</div>
      </section>
      <section class="phone" data-design="halo" aria-label="カメラUIデザイン比較">
        <div class="fallback"></div><video autoplay muted playsinline></video><div class="shade"></div>
        <div class="top"><button class="close glass" aria-label="閉じる">×</button><span class="title glass">写真で集める</span><span style="width:44px"></span></div>
        <div class="switcher glass" role="group" aria-label="デザイン案">
          <button data-set="halo" aria-pressed="true">A やわらかい輪</button><button data-set="corners" aria-pressed="false">B 四隅</button><button data-set="portal" aria-pressed="false">C 楕円</button>
        </div>
        <p class="hint">見つけたものを、この中に</p><div class="guide"><span></span><span></span><span></span><span></span></div>
        <div class="controls">
          <div class="zoom"><button aria-pressed="true" data-zoom="1">1×</button><button aria-pressed="false" data-zoom="2">2×</button></div>
          <form class="search glass"><input aria-label="単語" placeholder="単語を打って調べる"><button aria-label="検索">⌕</button></form>
          <div class="actions"><button class="action type"><i>⌨</i>文字で調べる</button><button class="shutter" aria-label="撮影"></button><button class="action scan"><i>⌗</i>かざして調べる</button></div>
        </div>
        <div class="flash"></div><div class="toast" role="status"></div>
      </section>
    </main>
    <script>
      const phone=document.querySelector('.phone'), video=document.querySelector('video'), toast=document.querySelector('.toast');
      document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ phone.dataset.design=b.dataset.set; document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
      document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{ const z=Number(b.dataset.zoom); video.style.transform=`scale(${z})`; document.querySelector('.fallback').style.transform=`scale(${z})`; document.querySelectorAll('[data-zoom]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
      document.querySelector('.type').onclick=()=>document.querySelector('.search').classList.toggle('open');
      document.querySelector('.search').onsubmit=e=>{e.preventDefault(); say('文字検索の動きを確認しました');};
      document.querySelector('.scan').onclick=()=>say('スキャン画面へ移動するボタンです');
      document.querySelector('.close').onclick=()=>say('本番ではホームへ戻ります');
      document.querySelector('.shutter').onclick=()=>{const f=document.querySelector('.flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');say('撮影しました（比較ページなので保存しません）');};
      function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
      navigator.mediaDevices?.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(s=>video.srcObject=s).catch(()=>say('カメラなしでもデザインを比較できます'));
    </script>
  </body>
</html>
